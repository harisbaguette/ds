<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>패토브 로고</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#17203a;font-family:'Avenir Next','Apple SD Gothic Neo',sans-serif}.board{width:1440px;min-height:960px;padding:100px}.signature{display:flex;align-items:center;gap:28px;margin:65px 0 140px}.signature img{width:110px;height:110px}.signature span{font-size:130px;font-weight:800;letter-spacing:-7px;line-height:1}.row{display:grid;grid-template-columns:1fr 1fr;gap:28px}.tile{height:290px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:35px;background:#f5f5f2}.tile.blue{background:#284ceb}.tile.blue img{width:130px;height:130px;filter:brightness(0) invert(1)}.sizes{align-items:end}.sizes>div{display:grid;justify-items:center;gap:24px;font:12px monospace;color:#74746e}.palette{display:flex;gap:8px;margin-top:32px}.palette div{height:45px;flex:1;padding:12px;font:12px monospace;border-radius:5px}.blue-swatch{background:#284ceb;color:white}.ink-swatch{background:#17203a;color:white}.white-swatch{border:1px solid #e7e7e3}</style><div class="board"><div class="signature"><img src="assets/mark.svg" alt=""><span>pattove</span></div><div class="row"><div class="tile sizes"><div><img src="assets/mark.svg" width="16" height="16" alt="">16</div><div><img src="assets/mark.svg" width="24" height="24" alt="">24</div><div><img src="assets/mark.svg" width="32" height="32" alt="">32</div><div><img src="assets/mark.svg" width="48" height="48" alt="">48</div><div><img src="assets/mark.svg" width="64" height="64" alt="">64</div></div><div class="tile blue"><img src="assets/mark.svg" alt="패토브 단색 심벌"></div></div><div class="palette"><div class="blue-swatch">#284CEB</div><div class="ink-swatch">#17203A</div><div class="white-swatch">#FFFFFF</div></div></div></html>
