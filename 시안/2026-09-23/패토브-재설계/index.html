<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>패토브</title>
  <link rel="stylesheet" href="app.css"><link rel="stylesheet" href="style-lab.css"><link rel="icon" href="assets/mark.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#main">본문으로</a>
  <header class="header">
    <a class="brand" href="#" aria-label="패토브 홈"><img src="assets/mark.svg" alt=""><span>pattove</span></a>
    <nav class="top-nav" aria-label="주 메뉴">
      <button data-page="patterns" aria-current="page">패턴</button>
      <button data-page="styles">스타일</button>
      <button data-page="saved">저장 <span class="saved-count">0</span></button>
    </nav>
    <form id="search-form" role="search">
      <div class="search-field"><span id="search-icon"></span><input id="query" aria-label="패턴 이름이나 상황 검색" autocomplete="off" placeholder="이름이나 상황 검색"><button type="button" id="clear-query" aria-label="검색어 지우기" hidden>×</button><button class="search-submit" type="submit" aria-label="검색">↵</button></div>
      <div class="search-suggestions" id="search-suggestions" aria-label="검색 예시" hidden><button type="button" data-query="저장 완료">저장 완료 알림<span>↗</span></button><button type="button" data-query="많은 항목 목록">긴 목록<span>↗</span></button><button type="button" data-query="입력 오류">입력 오류<span>↗</span></button></div>
    </form>
  </header>
  <div class="app-layout">
    <aside id="sidebar" aria-label="목적별 분류"></aside>
    <main id="main" tabindex="-1">
      <section id="pattern-page" aria-labelledby="result-title">
        <div class="collection-toolbar">
          <div class="results-heading"><h1 id="result-title">전체</h1><span id="result-count"></span></div>
          <div class="filter-bar">
            <select class="mobile-category" id="category-mobile" aria-label="목적"></select>
            <select id="device" aria-label="기기" hidden><option value="all">모든 기기</option><option value="web">웹</option><option value="mobile">모바일</option></select>
            <select id="status" aria-label="상태"><option value="all">모든 상태</option><option value="normal">기본</option><option value="success">완료</option><option value="loading">로딩</option><option value="empty">내용 없음</option><option value="error">오류</option></select>
            <select id="preview-style" aria-label="스타일"></select>
            <button id="compare-mode" class="compare-mode-toggle" aria-pressed="false" aria-controls="pattern-grid">비교</button>
            <div class="density" aria-label="보기 방식"><button id="view-gallery" aria-label="갤러리 보기" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="12" y="3" width="5" height="5" rx="1"/><rect x="3" y="12" width="5" height="5" rx="1"/><rect x="12" y="12" width="5" height="5" rx="1"/></svg></button><button id="view-compact" aria-label="목록 보기" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button></div>
          </div>
          <button class="text-button" id="reset-filters" hidden>초기화</button>
        </div>
        <div id="pattern-grid" class="pattern-grid"></div>
        <div id="empty-results" class="empty-results" hidden><h2>검색 결과 없음</h2><button class="secondary" data-reset>전체 보기</button></div>
      </section>
      <section id="style-page" hidden></section>
      <section id="saved-page" hidden></section>
    </main>
  </div>
  <div id="compare-tray" class="compare-tray" hidden></div>
  <dialog id="detail-dialog" aria-labelledby="detail-title"></dialog>
  <dialog id="compare-dialog" aria-labelledby="compare-title"></dialog>
  <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
  <div id="notice" class="notice" role="status" hidden></div>
  <script src="data.js"></script><script src="app.js"></script><script src="style-lab.js"></script>
</body>
</html>
