<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>패토브 — 상황으로 찾는 UI 사전</title>
  <link rel="stylesheet" href="app.css"><link rel="icon" href="assets/mark.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="header">
    <a class="brand" href="#" aria-label="패토브 패턴 찾기"><img src="assets/mark.svg" alt=""><span>pattove<span class="brand-ko">패토브</span></span></a>
    <nav class="top-nav" aria-label="주 메뉴">
      <button data-page="patterns" aria-current="page">패턴 찾기</button>
      <button data-page="styles">스타일</button>
      <button data-page="saved">저장한 패턴 <span class="saved-count">0</span></button>
    </nav>
    <div class="header-note">이름을 몰라도, 모양을 보면.</div>
  </header>
  <div class="app-layout">
    <aside id="sidebar" aria-label="목적별 패턴 분류"></aside>
    <main id="main" tabindex="-1">
      <section id="pattern-page">
        <div class="intro"><div><p class="eyebrow">상황으로 찾는 UI 사전</p><h1>어떤 화면을 만들고 있나요?</h1></div><p class="scope-label">탐색 시안 · 대표 패턴 16개</p></div>
        <form id="search-form" role="search">
          <label class="sr-only" for="query">패턴 이름이나 만들고 싶은 상황</label>
          <div class="search-field"><span id="search-icon"></span><input id="query" autocomplete="off" placeholder="예: 저장이 끝났다고 알려주고 싶어요"><button type="button" id="clear-query" aria-label="검색어 지우기" hidden>×</button><button class="primary" type="submit">찾기</button></div>
        </form>
        <div class="task-chips" aria-label="상황 예시"><span>이런 상황이라면</span><button data-query="저장이 끝났다고 알려주기">저장 완료 알리기</button><button data-query="많은 항목을 나눠서 보여주기">긴 목록 보여주기</button><button data-query="처음이라 내용이 없는 화면">빈 화면 안내하기</button></div>
        <div class="filter-bar">
          <label class="mobile-category">목적 <select id="category-mobile"></select></label>
          <label>기기 <select id="device"><option value="all">모든 기기</option><option value="web">웹</option><option value="mobile">모바일</option></select></label>
          <label>상태 <select id="status"><option value="all">모든 상태</option><option value="normal">기본</option><option value="success">완료</option><option value="loading">로딩</option><option value="empty">내용 없음</option><option value="error">오류</option></select></label>
          <label class="style-filter">미리보기 스타일 <select id="preview-style"><option value="clear">또렷한 기본</option><option value="ink">잉크 노트</option><option value="calm">고요한 색면</option></select></label>
          <div class="density" aria-label="보기 방식"><button id="view-gallery" aria-pressed="true" title="미리보기">그림 보기</button><button id="view-compact" aria-pressed="false" title="빠르게 훑기">빠르게 훑기</button></div>
        </div>
        <div class="results-heading"><div><h2 id="result-title">모든 패턴</h2><span id="result-count"></span></div><button class="text-button" id="reset-filters" hidden>조건 초기화</button></div>
        <p class="result-reason" id="result-reason" hidden></p>
        <div id="pattern-grid" class="pattern-grid"></div>
        <div id="empty-results" class="empty-results" hidden><h2>맞는 패턴을 찾지 못했어요</h2><p>‘저장’, ‘목록’, ‘입력 오류’처럼 짧게 검색하거나 조건을 풀어보세요.</p><button class="secondary" data-reset>전체 패턴 보기</button></div>
      </section>
      <section id="style-page" hidden></section>
      <section id="saved-page" hidden></section>
    </main>
  </div>
  <div id="compare-tray" class="compare-tray" hidden></div>
  <dialog id="detail-dialog" aria-labelledby="detail-title"></dialog>
  <dialog id="compare-dialog" aria-labelledby="compare-title"></dialog>
  <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
  <div id="notice" class="notice" role="status" hidden></div>
  <script src="data.js"></script><script src="app.js"></script>
</body>
</html>
