<body class="ds theme-main has-subnav">
  <a class="skip-link" href="#main">본문으로</a>
  <header class="app-top">
    <a class="top-brand" href="#/styles" aria-label="패토브 홈" data-focus="home"><img src="assets/mark.svg" alt="" width="32" height="32"></a>
    <nav id="primary-nav" class="primary-nav" aria-label="주 메뉴"></nav>
    <button type="button" id="search-open" class="search-open" aria-label="검색" aria-haspopup="dialog" aria-controls="search-dialog" aria-keyshortcuts="/ Control+K Meta+K" data-focus="search-open"><span data-ui-icon-slot="search" aria-hidden="true"></span></button>
  </header>
  <div class="menu-backdrop" id="menu-backdrop"></div>
  <aside class="app-menu" id="app-menu" aria-label="하위 분류">
    <div class="menu-head">
      <span class="top-title" id="top-title"></span>
      <button type="button" class="menu-close ds-button" data-variant="outline" data-size="sm" data-icon-only data-action="close-menu" aria-label="메뉴 닫기" title="메뉴 닫기"><span data-ui-icon-slot="close" aria-hidden="true"></span></button>
    </div>
    <div class="menu-body">
      <nav id="secondary-nav" class="secondary-nav" aria-label="하위 분류"></nav>
    </div>
    <div class="menu-foot">
      <button type="button" id="rail-toggle" class="rail-toggle ds-button" data-variant="ghost" data-size="sm" data-icon-only aria-label="사이드 메뉴 접기" title="사이드 메뉴 접기" aria-expanded="true" aria-controls="secondary-nav" data-focus="rail-toggle"><span data-ui-icon-slot="first" aria-hidden="true"></span></button>
    </div>
  </aside>
  <!-- Pages without a side menu (old pattern and component addresses) drop its space before the first paint. -->
  <script>(function(){var p=location.hash.split('?')[0].replace(/^#\/?/,'');if(p&&p!=='main'&&['styles','dictionary','system','motion'].indexOf(p)<0){document.getElementById('app-menu').hidden=true;document.body.classList.remove('has-subnav');}})();</script>
  <main id="main" tabindex="-1">
    <div id="page-heading"></div>
    <div id="catalog-toolbar" class="catalog-toolbar">
      <div id="header-context" class="header-context"></div>
      <div id="catalog-categories" class="catalog-categories">
        <span id="category-label" class="toolbar-label">분류</span>
        <button type="button" id="menu-toggle" class="menu-toggle ds-button" data-variant="outline" data-size="sm" aria-labelledby="category-label category-current" aria-expanded="false" aria-controls="app-menu" data-focus="menu-toggle"><span data-ui-icon-slot="menu" aria-hidden="true"></span><span id="category-current">전체 보기</span></button>
      </div>
      <div id="preview-context" class="preview-context" hidden></div>
      <div id="collection-controls" class="collection-controls" hidden></div>
      <button type="button" id="query-chip" class="query-chip ds-button" data-variant="outline" data-size="sm" data-action="clear-query" data-focus="query-chip" hidden></button>
    </div>
    <div id="content"></div>
  </main>
  <dialog id="detail-dialog" class="ds-surface" data-material="raised" aria-labelledby="detail-title"></dialog>
  <dialog id="variant-dialog" class="variant-dialog ds-surface" aria-labelledby="variant-preview-title"></dialog>
  <dialog id="search-dialog" class="search-dialog ds-surface" data-material="raised" aria-label="검색">
    <div class="search-area">
      <div class="search-head">
      <form class="search ds-input-group" id="search-form" role="search">
        <label class="sr-only" for="query">검색</label>
        <span data-ui-icon-slot="search" aria-hidden="true"></span>
        <input class="ds-input" id="query" name="query" placeholder="패턴 검색" autocomplete="off" maxlength="100" enterkeyhint="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-listbox" data-focus="search-query">
        <button id="search-clear" class="ds-input-tool" type="button" aria-label="검색어 지우기" title="검색어 지우기" data-focus="search-clear" hidden><span data-ui-icon-slot="close" aria-hidden="true"></span></button>
      </form>
      <button type="button" id="search-close" class="search-close" data-action="close-search">닫기</button>
      </div>
      <div class="search-scope" id="search-scope" role="group" aria-label="검색 범위"></div>
      <p class="search-idle" id="search-idle">이름이나 ID로 찾아보세요.</p>
      <span id="search-result-status" class="sr-only" role="status" aria-live="polite"></span>
      <div class="search-popover" id="search-popover" hidden>
        <div id="search-suggestions"></div>
        <button type="button" class="search-all ds-button" data-variant="ghost" data-size="sm" data-action="search-all">검색 결과 보기 <span aria-hidden="true">↵</span></button>
      </div>
    </div>
  </dialog>
  <p class="sr-only" id="announcer" role="status" aria-live="polite"></p>
  <dialog id="reference-dialog" class="reference-dialog ds-surface" data-material="raised" aria-labelledby="reference-title" aria-describedby="reference-help">
    <h2 id="reference-title">직접 복사</h2>
    <p id="reference-help">자동 복사를 사용할 수 없어요. 선택된 내용을 직접 복사하세요.</p>
    <textarea class="ds-input" readonly aria-label="복사할 내용" spellcheck="false"></textarea>
    <form method="dialog" class="reference-dismiss"><button class="icon-button ds-button" data-variant="outline" data-icon-only aria-label="복사 창 닫기" title="복사 창 닫기"><span data-ui-icon-slot="close" aria-hidden="true"></span></button></form>
  </dialog>
  <noscript><p class="noscript">화면 이동과 저장을 사용하려면 JavaScript를 켜 주세요.</p></noscript>
</body>
