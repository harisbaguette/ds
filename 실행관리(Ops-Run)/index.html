<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9edf2">
  <title>패토브 · 스타일</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/previews.css">
  <link rel="stylesheet" href="src/styles/themes.css">
  <link rel="stylesheet" href="src/system/parts.css">
  <link rel="stylesheet" href="src/styles/shell.css">
  <link rel="stylesheet" href="src/styles/dialogs.css">
  <link rel="stylesheet" href="src/styles/library.css">
  <link rel="stylesheet" href="src/styles/system.css">
  <link rel="stylesheet" href="src/styles/atlas.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <script defer src="src/data/catalog.js"></script>
  <script defer src="src/data/library.js"></script>
  <script defer src="src/ui/icons.js"></script>
  <script defer src="src/ui/previews.js"></script>
  <script defer src="src/system/registry.js"></script>
  <script defer src="src/system/parts.js"></script>
  <script defer src="src/system/behaviors.js"></script>
  <script defer src="src/data/system-source.js"></script>
  <script defer src="src/data/distribution.js"></script>
  <script defer src="src/vendor/zip.js"></script>
  <script defer src="src/ui/distribution.js"></script>
  <script defer src="src/ui/views.js"></script>
  <script defer src="src/ui/library-views.js"></script>
  <script defer src="src/ui/system.js"></script>
  <script defer src="src/ui/component-docs.js"></script>
  <script defer src="src/system/export.js"></script>
  <script defer src="src/app.js"></script>
</head>
<body class="theme-main">
  <a class="skip-link" href="#main">본문으로</a>
  <header class="app-header">
    <a class="brand" href="#/styles" aria-label="패토브 스타일 홈" data-focus="home"><img src="assets/mark.svg" alt="" width="32" height="32"></a>
    <nav id="primary-nav" class="primary-nav" aria-label="주 메뉴"></nav>
    <div id="header-context" class="header-context"></div>
    <div class="search-area" hidden>
      <form class="search" id="search-form" role="search">
        <label class="sr-only" for="query">패턴 검색</label>
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true" data-src="self:diagram"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
        <input id="query" name="query" placeholder="패턴 검색" autocomplete="off" maxlength="100" role="combobox" aria-autocomplete="list" aria-controls="search-suggestions" aria-expanded="false" data-focus="search-query">
        <button id="clear-search" type="button" aria-label="검색어 지우기" hidden>×</button>
        <button type="submit" aria-label="검색"><kbd aria-hidden="true">/</kbd><img class="search-submit-icon ui-icon" src="assets/icons/arrow.svg" alt="" width="18" height="18"></button>
      </form>
      <div class="search-popover" id="search-popover" hidden>
        <div id="search-suggestions" role="listbox" aria-label="검색 제안"></div>
        <button type="button" class="search-all" data-action="search-all">검색 결과 보기 <span aria-hidden="true">↵</span></button>
      </div>
    </div>
    <a id="saved-link" class="icon-button saved-link" href="#/saved" aria-label="저장한 패턴" data-focus="saved"><span class="saved-art nav-sprite nav-sprite-bookmark" aria-hidden="true"></span><span class="saved-dot" hidden></span></a>
  </header>
  <aside class="app-sidebar" id="site-navigation" hidden><nav id="sidebar" aria-label="패턴 분류"></nav></aside>
  <main id="main" tabindex="-1"></main>
  <dialog id="detail-dialog" aria-labelledby="detail-title"></dialog>
  <div class="notice" id="notice" role="status" hidden><span id="notice-text"></span><button type="button" data-action="undo-save" hidden>되돌리기</button></div>
  <p class="sr-only" id="announcer" role="status" aria-live="polite"></p>
  <noscript><p class="noscript">화면 이동과 저장을 사용하려면 JavaScript를 켜 주세요.</p></noscript>
</body>
</html>
