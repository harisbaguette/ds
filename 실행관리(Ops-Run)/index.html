  <aside class="app-menu" id="app-menu" aria-label="하위 분류" hidden>
    <div class="menu-head">

    </div>
  </aside>
  <main id="main" tabindex="-1">
    <div id="catalog-toolbar" class="catalog-toolbar">
      <div id="header-context" class="header-context"></div>
      <div id="catalog-categories" class="catalog-categories">
        <span id="category-label" class="toolbar-label">분류</span>
        <button type="button" id="menu-toggle" class="menu-toggle ds-button" data-variant="outline" data-size="sm" aria-labelledby="category-label category-current" aria-expanded="false" aria-controls="app-menu" data-focus="menu-toggle"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true" data-src="self:diagram"><path d="M4 7h16M4 12h16M4 17h16"></path></svg><span id="category-current">전체 보기</span></button>
      </div>
      <div id="preview-context" class="preview-context" hidden></div>
      <button type="button" id="query-chip" class="query-chip ds-button" data-variant="outline" data-size="sm" data-action="clear-query" data-focus="query-chip" hidden></button>
    </div>
    <div id="content"></div>
  </main>
  <dialog id="detail-dialog" class="ds-surface" data-material="raised" aria-labelledby="detail-title"></dialog>
  <dialog id="search-dialog" class="search-dialog ds-surface" data-material="raised" aria-label="검색">
    <div class="search-area">
      <form class="search ds-input-group" id="search-form" role="search">
        <label class="sr-only" for="query">검색</label>
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true" data-src="self:diagram"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
        <input class="ds-input" id="query" name="query" placeholder="패턴 검색" autocomplete="off" maxlength="100" role="combobox" aria-autocomplete="list" aria-controls="search-suggestions" aria-expanded="false" data-focus="search-query">
        <button id="search-clear" class="ds-input-tool" type="button" aria-label="검색어 지우기" title="검색어 지우기" data-focus="search-clear" hidden><svg viewBox="0 0 24 24" class="icon" aria-hidden="true" data-src="self:diagram"><path d="m7 7 10 10M7 17 17 7"></path></svg></button>
      </form>
      <div class="search-popover" id="search-popover" hidden>
        <div id="search-suggestions" role="listbox" aria-label="검색 제안"></div>
        <button type="button" class="search-all ds-button" data-variant="ghost" data-size="sm" data-action="search-all">검색 결과 보기 <span aria-hidden="true">↵</span></button>
      </div>
    </div>
  </dialog>
  <p class="sr-only" id="announcer" role="status" aria-live="polite"></p>
  <dialog id="reference-dialog" class="reference-dialog ds-surface" data-material="raised" aria-labelledby="reference-title" aria-describedby="reference-help">
    <h2 id="reference-title">AI용 정보 복사</h2>
    <p id="reference-help">자동 복사를 사용할 수 없어요. 아래 내용을 전체 선택해 복사한 뒤 AI에게 붙여 넣으세요.</p>
    <textarea class="ds-input" readonly aria-label="AI에게 전달할 요소 정보" spellcheck="false"></textarea>
    <form method="dialog" class="reference-dismiss"><button class="icon-button ds-button" data-variant="outline" data-icon-only aria-label="복사 창 닫기" title="복사 창 닫기"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"></path></svg></button></form>
  </dialog>
  <noscript><p class="noscript">화면 이동과 저장을 사용하려면 JavaScript를 켜 주세요.</p></noscript>
