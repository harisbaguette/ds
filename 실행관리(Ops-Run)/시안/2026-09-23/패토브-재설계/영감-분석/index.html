<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>패토브 영감 분석</title><style>*{box-sizing:border-box}body{margin:0;padding:40px;color:#252525;background:#f5f5f2;font:14px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}header{max-width:1360px;margin:0 auto 30px;display:flex;align-items:center;gap:20px}h1{font-size:21px}a{color:inherit}header a{margin-left:auto}main{max-width:1360px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}figure{margin:0;background:#fff}img{display:block;width:100%;height:280px;object-fit:contain;padding:12px}figcaption{padding:16px 18px 22px;border-top:1px solid #eee}b{font-size:11px}p{margin:8px 0 0;font-size:12px;color:#555}@media(max-width:950px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){body{padding:20px}main{grid-template-columns:1fr}}</style><header><h1>영감 분석 · 49</h1><a href="../index.html">패토브</a></header><main><figure><a href="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-고양이-금지-표지판-일본-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-고양이-금지-표지판-일본-pinterest.jpg" alt="2026-09-22-고양이-금지-표지판-일본-pinterest" loading="lazy"></a><figcaption><b>01 · 그래픽포스터</b><p>사진 속 표지판을 파랑·빨강과 단순 실루엣으로 치환. 강한 색도 형태를 적게 쓰면 명료하다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-나가노-겨울-사진-포스터-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-나가노-겨울-사진-포스터-pinterest.jpg" alt="2026-09-22-나가노-겨울-사진-포스터-pinterest" loading="lazy"></a><figcaption><b>02 · 그래픽포스터</b><p>사진 세 장과 중앙의 큰 지명. 반복 프레임은 남기되 UI에 사진 질감·잔문구를 억지로 옮기지 않는다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-발코니-소녀-파스텔-건물-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-발코니-소녀-파스텔-건물-pinterest.jpg" alt="2026-09-22-발코니-소녀-파스텔-건물-pinterest" loading="lazy"></a><figcaption><b>03 · 그래픽포스터</b><p>넓은 파스텔 면, 작은 인물, 비대칭 건물. 풍경의 주인공을 작게 두는 구도에 반영한다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-밤하늘-비행기-그림자-구름-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-밤하늘-비행기-그림자-구름-pinterest.jpg" alt="2026-09-22-밤하늘-비행기-그림자-구름-pinterest" loading="lazy"></a><figcaption><b>04 · 그래픽포스터</b><p>큰 남색 여백과 작은 비행기, 제한된 구름 형태. 풍경의 색 수와 사물 크기 기준.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-버튼-입체-단색-노랑-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-버튼-입체-단색-노랑-pinterest.jpg" alt="2026-09-22-버튼-입체-단색-노랑-pinterest" loading="lazy"></a><figcaption><b>05 · 그래픽포스터</b><p>노랑 바탕과 검정 윤곽의 사물 하나. 컬러블록의 색면·선명한 경계 기준.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-비닐봉지-수박-파랑바탕-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-비닐봉지-수박-파랑바탕-pinterest.jpg" alt="2026-09-22-비닐봉지-수박-파랑바탕-pinterest" loading="lazy"></a><figcaption><b>06 · 그래픽포스터</b><p>파랑 면에 큰 생활 사물 하나. 그림이 충분히 말하므로 설명을 덧붙이지 않는다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-사이다-병과-컵-벡터-유토이미지-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-사이다-병과-컵-벡터-유토이미지-pinterest.jpg" alt="2026-09-22-사이다-병과-컵-벡터-유토이미지-pinterest" loading="lazy"></a><figcaption><b>07 · 그래픽포스터</b><p>녹색 병과 가는 파랑 선의 컵. 채운 형태와 빈 선의 대비를 읽는다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-오키나와-전철-구름-포스터-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-오키나와-전철-구름-포스터-pinterest.jpg" alt="2026-09-22-오키나와-전철-구름-포스터-pinterest" loading="lazy"></a><figcaption><b>08 · 그래픽포스터</b><p>풍경·큰 제목·전철의 복합 포스터. 풍경 감성은 참고하되 조작 화면에 정보 밀도를 그대로 복사하지 않는다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-우유병-단색-포스터-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-우유병-단색-포스터-pinterest.jpg" alt="2026-09-22-우유병-단색-포스터-pinterest" loading="lazy"></a><figcaption><b>09 · 그래픽포스터</b><p>하늘색 면과 흰 병, 작은 세로 글자. 제한색·단일 중심 형태를 읽는다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-유연성-글자-타이포-하이파이브-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-유연성-글자-타이포-하이파이브-pinterest.jpg" alt="2026-09-22-유연성-글자-타이포-하이파이브-pinterest" loading="lazy"></a><figcaption><b>10 · 그래픽포스터</b><p>매우 큰 한글과 겹치는 곡선. 컬러블록의 숫자 굵기와 크기 대비로 전환한다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-졸음-경고-표지판-초록바탕-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-졸음-경고-표지판-초록바탕-pinterest.jpg" alt="2026-09-22-졸음-경고-표지판-초록바탕-pinterest" loading="lazy"></a><figcaption><b>11 · 그래픽포스터</b><p>초록 바탕과 검정·흰색 표지판. 강조색을 넓은 한 면에 모으는 방식.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-컨테이너-위-사람-하늘-포스터-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-컨테이너-위-사람-하늘-포스터-pinterest.jpg" alt="2026-09-22-컨테이너-위-사람-하늘-포스터-pinterest" loading="lazy"></a><figcaption><b>12 · 그래픽포스터</b><p>큰 하늘과 작은 인물, 수평 컨테이너. 풍경의 수평 분할과 규모 대비에 반영한다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-폴더-모양-침대-개념그림-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/그래픽포스터/2026-09-22-폴더-모양-침대-개념그림-pinterest.jpg" alt="2026-09-22-폴더-모양-침대-개념그림-pinterest" loading="lazy"></a><figcaption><b>13 · 그래픽포스터</b><p>폴더를 침대로 보는 시각적 비유. 빈 상태의 의미 있는 작은 그림에 참고하고 장식용 아이콘 증식을 피한다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/명함/2026-09-22-디자이너-명함-파랑-lulun-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/명함/2026-09-22-디자이너-명함-파랑-lulun-pinterest.jpg" alt="2026-09-22-디자이너-명함-파랑-lulun-pinterest" loading="lazy"></a><figcaption><b>14 · 명함</b><p>작은 초상화와 서명이 정체성을 만든다. 본문을 손글씨로 바꾸는 근거로 쓰지 않는다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/명함/2026-09-22-일러스트레이터-명함-흑백-karita-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/명함/2026-09-22-일러스트레이터-명함-흑백-karita-pinterest.jpg" alt="2026-09-22-일러스트레이터-명함-흑백-karita-pinterest" loading="lazy"></a><figcaption><b>15 · 명함</b><p>종이 위 검정 선화와 작은 정보. 선화의 여백·일관된 선·단정한 본문으로 전환한다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/설명도해/2026-09-22-발렌타인-키트-사용법-4단계-pinterest.png" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/설명도해/2026-09-22-발렌타인-키트-사용법-4단계-pinterest.png" alt="2026-09-22-발렌타인-키트-사용법-4단계-pinterest" loading="lazy"></a><figcaption><b>16 · 설명도해</b><p>큰 여백과 네 개의 선화 장면. 도해와 기능 안내를 짧게 분리하는 원칙.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/설명도해/2026-09-22-위생-습관-선화-8컷-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/설명도해/2026-09-22-위생-습관-선화-8컷-pinterest.jpg" alt="2026-09-22-위생-습관-선화-8컷-pinterest" loading="lazy"></a><figcaption><b>17 · 설명도해</b><p>가는 선과 제한된 하늘색 포인트. 모든 요소에 색을 칠하지 않는 선화 규칙.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/설명도해/2026-09-22-장보기-앱-이용-4단계-delish-kitchen-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/설명도해/2026-09-22-장보기-앱-이용-4단계-delish-kitchen-pinterest.jpg" alt="2026-09-22-장보기-앱-이용-4단계-delish-kitchen-pinterest" loading="lazy"></a><figcaption><b>18 · 설명도해</b><p>검정 선과 노랑 포인트, 읽는 순서가 분명한 장면. 색은 의미가 필요한 부분에만 둔다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/설명도해/2026-09-22-포인트-적립-3단계-docomo-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/설명도해/2026-09-22-포인트-적립-3단계-docomo-pinterest.jpg" alt="2026-09-22-포인트-적립-3단계-docomo-pinterest" loading="lazy"></a><figcaption><b>19 · 설명도해</b><p>선화와 사람 행동, 강조 부위만 채색. 설명 분량보다 행동 식별을 우선한다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/앱화면/2026-09-22-고양이-집중-타이머-3장-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/앱화면/2026-09-22-고양이-집중-타이머-3장-pinterest.jpg" alt="2026-09-22-고양이-집중-타이머-3장-pinterest" loading="lazy"></a><figcaption><b>20 · 앱화면</b><p>큰 고양이·시간·한 버튼으로 집중. 새 집중 예시의 정보 우선순위 참고.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/앱화면/2026-09-22-날씨앱-전체화면-모음-pinterest.png" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/앱화면/2026-09-22-날씨앱-전체화면-모음-pinterest.png" alt="2026-09-22-날씨앱-전체화면-모음-pinterest" loading="lazy"></a><figcaption><b>21 · 앱화면</b><p>큰 기하학적 날씨 기호와 작은 기능 정보. 풍경·컬러블록의 비율 대비 참고.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/앱화면/2026-09-22-단순-풍경-홈화면-4대-바다-pinterest.png" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/앱화면/2026-09-22-단순-풍경-홈화면-4대-바다-pinterest.png" alt="2026-09-22-단순-풍경-홈화면-4대-바다-pinterest" loading="lazy"></a><figcaption><b>22 · 앱화면</b><p>수평 색면 자체가 화면이 되는 바다. 풍경 예시의 배경 구조 핵심.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/앱화면/2026-09-22-단순-풍경-홈화면-4대-집-pinterest.png" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/앱화면/2026-09-22-단순-풍경-홈화면-4대-집-pinterest.png" alt="2026-09-22-단순-풍경-홈화면-4대-집-pinterest" loading="lazy"></a><figcaption><b>23 · 앱화면</b><p>작은 집과 동물, 넓은 면, 낮은 밀도. 풍경 속 사물은 하나로 제한한다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/앱화면/2026-09-22-두-화분-돌봄-홈화면-pinterest.png" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/앱화면/2026-09-22-두-화분-돌봄-홈화면-pinterest.png" alt="2026-09-22-두-화분-돌봄-홈화면-pinterest" loading="lazy"></a><figcaption><b>24 · 앱화면</b><p>식물 성장 상태를 시각적으로 크게 비교. 상태를 그림으로 설명하는 원칙은 참고하되 나무 프레임 질감은 가져오지 않는다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/앱화면/2026-09-22-루틴-체크-격자-myturn-pinterest.png" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/앱화면/2026-09-22-루틴-체크-격자-myturn-pinterest.png" alt="2026-09-22-루틴-체크-격자-myturn-pinterest" loading="lazy"></a><figcaption><b>25 · 앱화면</b><p>얇은 격자, 작은 선화, 반복 체크. 선화의 구조적 경계와 할 일 조작에 반영한다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/앱화면/2026-09-22-면허증-등록-온보딩-일본-pinterest.png" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/앱화면/2026-09-22-면허증-등록-온보딩-일본-pinterest.png" alt="2026-09-22-면허증-등록-온보딩-일본-pinterest" loading="lazy"></a><figcaption><b>26 · 앱화면</b><p>여백·손 그림·하나의 주요 버튼. 온보딩 문구 양을 현재 제품에 복사하지 않는다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/앱화면/2026-09-22-아바타-꾸미기-humation-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/앱화면/2026-09-22-아바타-꾸미기-humation-pinterest.jpg" alt="2026-09-22-아바타-꾸미기-humation-pinterest" loading="lazy"></a><figcaption><b>27 · 앱화면</b><p>큰 아바타와 정돈된 선택 격자. 선택 도구는 단순하게 두고 주인공을 크게 보여준다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/앱화면/2026-09-22-온보딩-3장-send-pay-sell-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/앱화면/2026-09-22-온보딩-3장-send-pay-sell-pinterest.jpg" alt="2026-09-22-온보딩-3장-send-pay-sell-pinterest" loading="lazy"></a><figcaption><b>28 · 앱화면</b><p>선화와 적은 보라 포인트. 본문이 많은 온보딩 배치는 현재 사전에 적용하지 않는다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/앱화면/2026-09-22-초록-띠-잠금화면-lemon-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/앱화면/2026-09-22-초록-띠-잠금화면-lemon-pinterest.jpg" alt="2026-09-22-초록-띠-잠금화면-lemon-pinterest" loading="lazy"></a><figcaption><b>29 · 앱화면</b><p>같은 계열의 넓은 색 띠가 정보를 나눈다. 컬러블록의 기능별 색면 구성 참고.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/앱화면/2026-09-22-흑백-rpg-레벨업-습관앱-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/앱화면/2026-09-22-흑백-rpg-레벨업-습관앱-pinterest.jpg" alt="2026-09-22-흑백-rpg-레벨업-습관앱-pinterest" loading="lazy"></a><figcaption><b>30 · 앱화면</b><p>흑백 윤곽과 캐릭터·진행 막대. 선화 UI의 경계·색 의존성 축소 기준.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/인물/2026-09-22-구름-하늘-바구니-소녀-문구-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/인물/2026-09-22-구름-하늘-바구니-소녀-문구-pinterest.jpg" alt="2026-09-22-구름-하늘-바구니-소녀-문구-pinterest" loading="lazy"></a><figcaption><b>31 · 인물</b><p>작은 인물 위 넓은 하늘과 구름. 풍경의 여백 참고, 구호 문장은 옮기지 않는다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/인물/2026-09-22-마이크-든-소녀-낙서-kobe-soul-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/인물/2026-09-22-마이크-든-소녀-낙서-kobe-soul-pinterest.jpg" alt="2026-09-22-마이크-든-소녀-낙서-kobe-soul-pinterest" loading="lazy"></a><figcaption><b>32 · 인물</b><p>굵기가 살아 있는 선과 제한된 파랑. 선의 개성은 참고하되 낙서 밀도를 입력·조작에 적용하지 않는다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/인물/2026-09-22-웨딩-입간판-신랑신부-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/인물/2026-09-22-웨딩-입간판-신랑신부-pinterest.jpg" alt="2026-09-22-웨딩-입간판-신랑신부-pinterest" loading="lazy"></a><figcaption><b>33 · 인물</b><p>신랑신부의 표정과 큰 실루엣. 친근한 인물 취향을 확인하되 서비스 화면의 주인공으로 강제하지 않는다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/인물/2026-09-22-은발-검정-드레스-여성-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/인물/2026-09-22-은발-검정-드레스-여성-pinterest.jpg" alt="2026-09-22-은발-검정-드레스-여성-pinterest" loading="lazy"></a><figcaption><b>34 · 인물</b><p>제한된 보라·검정과 선명한 인물 윤곽. 인물 일러스트 취향이며 UI 전반의 보라 그라데이션 근거가 아니다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/인물/2026-09-22-줄무늬-셔츠-바구니-소녀-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/인물/2026-09-22-줄무늬-셔츠-바구니-소녀-pinterest.jpg" alt="2026-09-22-줄무늬-셔츠-바구니-소녀-pinterest" loading="lazy"></a><figcaption><b>35 · 인물</b><p>인물과 아래쪽 풀, 위쪽 여백. 비대칭 중심과 배경 절제.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/인물/2026-09-22-커피컵-든-긴머리-여성-pinterest.png" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/인물/2026-09-22-커피컵-든-긴머리-여성-pinterest.png" alt="2026-09-22-커피컵-든-긴머리-여성-pinterest" loading="lazy"></a><figcaption><b>36 · 인물</b><p>남색·살구색·흰색의 큰 덩어리. 적은 색으로 인물을 읽게 하는 방식.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/인물/2026-09-22-파랑-단색-졸린-얼굴-sushi-pinterest.png" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/인물/2026-09-22-파랑-단색-졸린-얼굴-sushi-pinterest.png" alt="2026-09-22-파랑-단색-졸린-얼굴-sushi-pinterest" loading="lazy"></a><figcaption><b>37 · 인물</b><p>선명한 파랑·흰색과 큰 반복 타이포. 컬러블록의 주조색·무게감 핵심.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/인물/2026-09-22-파랑-모자-소녀와-고양이-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/인물/2026-09-22-파랑-모자-소녀와-고양이-pinterest.jpg" alt="2026-09-22-파랑-모자-소녀와-고양이-pinterest" loading="lazy"></a><figcaption><b>38 · 인물</b><p>흰 여백과 하늘색 의상, 개성 있는 선. 면을 가득 채우지 않는 인물 배치.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/인물/2026-09-22-패딩-비니-전신-인물-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/인물/2026-09-22-패딩-비니-전신-인물-pinterest.jpg" alt="2026-09-22-패딩-비니-전신-인물-pinterest" loading="lazy"></a><figcaption><b>39 · 인물</b><p>작은 인물 하나와 평평한 베이지 면. 베이지 카드 UI 선호로 일반화하지 않는다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/인물/2026-09-22-헤드폰-끼고-자는-사람과-고양이-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/인물/2026-09-22-헤드폰-끼고-자는-사람과-고양이-pinterest.jpg" alt="2026-09-22-헤드폰-끼고-자는-사람과-고양이-pinterest" loading="lazy"></a><figcaption><b>40 · 인물</b><p>넓은 어두운 면과 아래쪽 인물. 풍경의 넓은 여백과 낮은 위치의 장면 참고.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/캐릭터/2026-09-22-간식-든-흑백-고양이-선화-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/캐릭터/2026-09-22-간식-든-흑백-고양이-선화-pinterest.jpg" alt="2026-09-22-간식-든-흑백-고양이-선화-pinterest" loading="lazy"></a><figcaption><b>41 · 캐릭터</b><p>표정이 단순한 검정·흰색 고양이. 선화의 단순 곡선과 빈 면 참고.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/캐릭터/2026-09-22-달리는-고양이-마스코트-wohooo-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/캐릭터/2026-09-22-달리는-고양이-마스코트-wohooo-pinterest.jpg" alt="2026-09-22-달리는-고양이-마스코트-wohooo-pinterest" loading="lazy"></a><figcaption><b>42 · 캐릭터</b><p>녹색·검정·흰색, 굵은 캐릭터와 스티커. 브랜드 그래픽은 강하게, UI 조작은 정돈한다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/캐릭터/2026-09-22-로딩-표시-머리-검은고양이-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/캐릭터/2026-09-22-로딩-표시-머리-검은고양이-pinterest.jpg" alt="2026-09-22-로딩-표시-머리-검은고양이-pinterest" loading="lazy"></a><figcaption><b>43 · 캐릭터</b><p>작은 검은 고양이와 로딩 표시. 상태를 캐릭터 행동으로 표현하는 아이디어.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/캐릭터/2026-09-22-물고기-가방-검은고양이-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/캐릭터/2026-09-22-물고기-가방-검은고양이-pinterest.jpg" alt="2026-09-22-물고기-가방-검은고양이-pinterest" loading="lazy"></a><figcaption><b>44 · 캐릭터</b><p>검은 실루엣과 파랑 가방, 작은 분홍 포인트. 한 주색과 좁은 보조색 관계.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/캐릭터/2026-09-22-비닐봉지-타고-나는-검은고양이-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/캐릭터/2026-09-22-비닐봉지-타고-나는-검은고양이-pinterest.jpg" alt="2026-09-22-비닐봉지-타고-나는-검은고양이-pinterest" loading="lazy"></a><figcaption><b>45 · 캐릭터</b><p>큰 파랑 여백에 작은 날아가는 캐릭터. 여백을 억지 문구로 채우지 않는 기준.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/캐릭터/2026-09-22-빨강-바탕-기지개-고양이-포스터-pinterest.png" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/캐릭터/2026-09-22-빨강-바탕-기지개-고양이-포스터-pinterest.png" alt="2026-09-22-빨강-바탕-기지개-고양이-포스터-pinterest" loading="lazy"></a><figcaption><b>46 · 캐릭터</b><p>빨강과 흰색 두 색, 잘리는 큰 고양이. 단색의 힘은 참고하되 주요 조작은 잘라 배치하지 않는다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/캐릭터/2026-09-22-사무실-의자-탄-고양이-노랑-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/캐릭터/2026-09-22-사무실-의자-탄-고양이-노랑-pinterest.jpg" alt="2026-09-22-사무실-의자-탄-고양이-노랑-pinterest" loading="lazy"></a><figcaption><b>47 · 캐릭터</b><p>노랑 면, 따뜻한 흰 고양이, 검정 선. 캐릭터의 온기와 높은 명료도 조합.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/캐릭터/2026-09-22-유령-옷-입은-아이-obake-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/캐릭터/2026-09-22-유령-옷-입은-아이-obake-pinterest.jpg" alt="2026-09-22-유령-옷-입은-아이-obake-pinterest" loading="lazy"></a><figcaption><b>48 · 캐릭터</b><p>거친 손 선과 단순 유령 실루엣. 작은 비정형 포인트는 허용하되 손글씨 본문은 피한다.</p></figcaption></figure><figure><a href="../../../../영감보관함/이미지/캐릭터/2026-09-22-잠자는-고양이-스티커-선화-pinterest.jpg" target="_blank" rel="noopener"><img src="../../../../영감보관함/이미지/캐릭터/2026-09-22-잠자는-고양이-스티커-선화-pinterest.jpg" alt="2026-09-22-잠자는-고양이-스티커-선화-pinterest" loading="lazy"></a><figcaption><b>49 · 캐릭터</b><p>굵은 외곽선과 쉬는 자세. 선화 예시의 편안한 표정 참고, 원본 스티커와 워터마크는 그대로 보존한다.</p></figcaption></figure></main></html>
